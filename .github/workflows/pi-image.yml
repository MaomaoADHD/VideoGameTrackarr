# Fork only (local deploy branches): builds the arm64 image on GitHub's arm runner, so the
# Raspberry Pi only has to download it (building there runs it out of memory).
name: Pi image

on:
  push:
    branches: ["local/**"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: videogametrackarr:local
          outputs: type=docker,dest=/tmp/image.tar
      - name: Compress
        run: gzip -1 /tmp/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: pi-image
          path: /tmp/image.tar.gz
          retention-days: 7
